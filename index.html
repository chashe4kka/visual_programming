<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MarvelPedia - Интерактивная энциклопедия Marvel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --accent: #e23636;
            --accent-dark: #b12a2a;
            --border: #ddd;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --card-bg: #ffffff;
            --sidebar-bg: #1a1a2e;
            --sidebar-text: #ffffff;
            --hover-bg: rgba(226, 54, 54, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #aaa;
            --accent: #e23636;
            --accent-dark: #ff4a4a;
            --border: #333;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
            --card-bg: #16213e;
            --sidebar-bg: #0f0f1a;
            --sidebar-text: #ffffff;
            --hover-bg: rgba(226, 54, 54, 0.2);
        }

        body {
            font-family: 'Segoe UI', 'Montserrat', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        #app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
            }
            .burger-menu {
                display: none;
            }
            .main-content {
                margin-left: 280px;
            }
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo i {
            color: var(--accent);
            margin-right: 10px;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 24px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: all 0.3s ease;
            gap: 12px;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(226, 54, 54, 0.2);
        }

        .nav-link.active {
            background: var(--accent);
        }

        .badge {
            background: var(--accent);
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: auto;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .theme-toggle, .admin-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .theme-toggle:hover, .admin-btn:hover {
            background: var(--accent);
        }

        .main-content {
            flex: 1;
            width: 100%;
        }

        .top-bar {
            background: var(--bg-secondary);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .burger-menu {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }

        #pageTitle {
            font-size: 24px;
            font-weight: bold;
        }

        .page-content {
            padding: 24px;
            min-height: calc(100vh - 80px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            color: white;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .favorite-btn.active {
            color: #ff4444;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
        }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge-status, .badge-team, .badge-phase {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 12px;
            background: var(--hover-bg);
        }

        .badge-status.hero { background: #4caf50; color: white; }
        .badge-status.villain { background: #f44336; color: white; }
        .badge-status.antihero { background: #ff9800; color: white; }

        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            margin-right: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
        }

        .btn-secondary {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .filters-bar {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .filter-select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card i {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        .random-fact {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 4px solid var(--accent);
        }

        .welcome-section {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 20px;
            color: white;
            margin-bottom: 30px;
        }

        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-container.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
        }

        .notification {
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--bg-secondary);
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .notification.success { border-left: 4px solid #4caf50; }
        .notification.error { border-left: 4px solid #f44336; }

        @media (max-width: 768px) {
            .page-content { padding: 16px; }
            .cards-grid { grid-template-columns: 1fr; }
            .filters-bar { flex-direction: column; }
            .filter-group { width: 100%; }
            .filter-select { flex: 1; }
        }
    </style>
</head>

        const Storage = {
            keys: { characters: 'marvel_chars', movies: 'marvel_movies', comics: 'marvel_comics', favorites: 'marvel_favs', ratings: 'marvel_ratings', theme: 'marvel_theme' },
            
            init() {
                if (!localStorage.getItem(this.keys.characters)) localStorage.setItem(this.keys.characters, JSON.stringify(MARVEL_DATA.characters));
                if (!localStorage.getItem(this.keys.movies)) localStorage.setItem(this.keys.movies, JSON.stringify(MARVEL_DATA.movies));
                if (!localStorage.getItem(this.keys.comics)) localStorage.setItem(this.keys.comics, JSON.stringify(MARVEL_DATA.comics));
                if (!localStorage.getItem(this.keys.favorites)) localStorage.setItem(this.keys.favorites, JSON.stringify([]));
                if (!localStorage.getItem(this.keys.ratings)) localStorage.setItem(this.keys.ratings, JSON.stringify({}));
            },
            
            getCharacters() { return JSON.parse(localStorage.getItem(this.keys.characters) || '[]'); },
            getMovies() { return JSON.parse(localStorage.getItem(this.keys.movies) || '[]'); },
            getComics() { return JSON.parse(localStorage.getItem(this.keys.comics) || '[]'); },
            getFavorites() { return JSON.parse(localStorage.getItem(this.keys.favorites) || '[]'); },
            getRatings() { return JSON.parse(localStorage.getItem(this.keys.ratings) || '{}'); },
            getTheme() { return localStorage.getItem(this.keys.theme) || 'light'; },
            
            saveCharacters(data) { localStorage.setItem(this.keys.characters, JSON.stringify(data)); },
            saveMovies(data) { localStorage.setItem(this.keys.movies, JSON.stringify(data)); },
            saveComics(data) { localStorage.setItem(this.keys.comics, JSON.stringify(data)); },
            saveFavorites(data) { localStorage.setItem(this.keys.favorites, JSON.stringify(data)); },
            saveRatings(data) { localStorage.setItem(this.keys.ratings, JSON.stringify(data)); },
            saveTheme(theme) { localStorage.setItem(this.keys.theme, theme); },
            
            isFavorite(id) { return this.getFavorites().some(f => f.id === id); },
            addFavorite(id, type) { let favs = this.getFavorites(); if (!this.isFavorite(id)) { favs.push({ id, type }); this.saveFavorites(favs); return true; } return false; },
            removeFavorite(id) { this.saveFavorites(this.getFavorites().filter(f => f.id !== id)); },
            
            getUserRating(movieId) { return this.getRatings()[movieId] || null; },
            setUserRating(movieId, rating) { let ratings = this.getRatings(); ratings[movieId] = rating; this.saveRatings(ratings); }
        };

                notif.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;">✕</button>`;
                container.appendChild(notif);

        function getImagePath(id, type) {
            if (type === 'comic') {
                const num = id.replace('com', '');
                return `images/com_${num}.jpg`;
            } else if (type === 'character') {
                return `images/${id}.jpg`;
            } else if (type === 'movie') {
                return `images/${id}.jpg`;
            }
            return `images/${id}.jpg`;
        }
        
        function getImageHtml(id, name, type) {
            const imgPath = getImagePath(id, type);
            // Кодируем имя для placeholder
            const encodedName = encodeURIComponent(name);
            
            return `<img src="${imgPath}" 
                        alt="${name}"
                        style="width:100%; height:100%; object-fit:cover;"
                        onerror="this.onerror=null; this.src='https://placehold.co/400x300/e23636/white?text=${encodedName}';">`;
        }

        function renderCharacterCard(char, isFav) {
            const statusClass = char.status === 'hero' ? 'hero' : (char.status === 'villain' ? 'villain' : 'antihero');
            const statusText = char.status === 'hero' ? 'Герой' : (char.status === 'villain' ? 'Злодей' : 'Антигерой');
            return `
                <div class="card" data-id="${char.id}" data-type="character">
                    <button class="favorite-btn ${isFav ? 'active' : ''}" data-id="${char.id}" data-type="character"><i class="fas fa-heart"></i></button>
                    <div class="card-image">
                        ${getImageHtml(char.id, char.name, 'character')}
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${char.name}</h3>
                        <p class="card-description">${char.description.substring(0, 80)}...</p>
                        <div class="card-meta">
                            <span class="badge-status ${statusClass}">${statusText}</span>
                            <span class="badge-team">${char.team}</span>
                        </div>
                        <div class="card-stats">
                            <span>⚡ Сила: ${char.powerLevel}</span>
                            <span>📅 ${char.firstAppearance}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${char.powerLevel}%"></div></div>
                        <button class="btn btn-primary details-btn" data-id="${char.id}" data-type="character">Подробнее</button>
                    </div>
                </div>
            `;
        }

        function renderComics() {
            const container = document.getElementById('pageContent');
            let comics = Storage.getComics();
            let searchTerm = '';
            let sortBy = 'title';
            let sortOrder = 'asc';
            
            function applyFilters() {
                let filtered = [...comics];
                
                if (searchTerm) {
                    filtered = filtered.filter(comic => 
                        comic.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        comic.author.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                
                filtered.sort((a, b) => {
                    let aVal = a[sortBy];
                    let bVal = b[sortBy];
                    if (typeof aVal === 'string') {
                        aVal = aVal.toLowerCase();
                        bVal = bVal.toLowerCase();
                    }
                    if (sortOrder === 'asc') {
                        return aVal > bVal ? 1 : -1;
                    } else {
                        return aVal < bVal ? 1 : -1;
                    }
                });
                
                container.innerHTML = `
                    <div class="filters-bar">

            });
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Избранное</h2>
                    <button id="clearAllFav" class="btn btn-secondary">Очистить всё</button>
                </div>
                <div class="cards-grid">${items.length > 0 ? items.map(item => {
                    if (item.type === 'character') return renderCharacterCard(item, true);
                    if (item.type === 'movie') return renderMovieCard(item, true, Storage.getUserRating(item.id));
                    return renderComicCard(item, true);
                }).join('') : '<p style="text-align:center; padding: 40px;">Нет избранных элементов</p>'}</div>
            `;
            attachCardEvents();
            attachFavoriteEvents();
            attachRatingEvents();
            document.getElementById('clearAllFav')?.addEventListener('click', () => {
                Storage.saveFavorites([]);
                Notify.success('Избранное очищено');
                renderFavorites();
                document.getElementById('favoritesCount').innerText = '0';
            });
        }
        
        function attachCardEvents() {
            document.querySelectorAll('.details-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const type = btn.dataset.type;
                    let item, content = '';
                    if (type === 'character') {
                        item = Storage.getCharacters().find(c => c.id === id);
                        content = `
                            <img src="images/${item.id}.jpg" class="modal-image" onerror="this.src='https://placehold.co/400x300/e23636/white?text=${encodeURIComponent(item.name)}'">
                            <h3>${item.name}</h3>
                            <p><strong>Описание:</strong> ${item.description}</p>
                            <p><strong>Команда:</strong> ${item.team}</p>
                            <p><strong>Статус:</strong> ${item.status === 'hero' ? 'Герой' : (item.status === 'villain' ? 'Злодей' : 'Антигерой')}</p>
                            <p><strong>Год первого появления:</strong> ${item.firstAppearance}</p>
                            <p><strong>Уровень силы:</strong> ${item.powerLevel}/100</p>
                            <div class="progress-bar"><div class="progress-fill" style="width: ${item.powerLevel}%"></div></div>
                            <p><strong>Способности:</strong> ${item.abilities.join(', ')}</p>
                        `;
                    } else if (type === 'movie') {
                        item = Storage.getMovies().find(m => m.id === id);
                        content = `
                            <img src="images/${item.id}.jpg" class="modal-image" onerror="this.src='https://placehold.co/400x300/e23636/white?text=${encodeURIComponent(item.title)}'">
                            <h3>${item.title}</h3>
                            <p><strong>Описание:</strong> ${item.description}</p>
                            <p><strong>Фаза Marvel:</strong> ${item.phase}</p>
                            <p><strong>Год выхода:</strong> ${item.year}</p>
                            <p><strong>Рейтинг IMDB:</strong> ⭐ ${item.rating}/10</p>
                            <p><strong>Длительность:</strong> ${item.duration} мин</p>
                            ${Storage.getUserRating(id) ? `<p><strong>Ваша оценка:</strong> ⭐ ${Storage.getUserRating(id)}/10</p>` : ''}
                        `;
                    } else {
                        item = Storage.getComics().find(c => c.id === id);
                        const comicNumber = item.id.replace('com', '');
                        content = `
                            <img src="images/com_${comicNumber}.jpg" class="modal-image" onerror="this.src='https://placehold.co/400x300/e23636/white?text=${encodeURIComponent(item.title)}'">
                            <h3>${item.title}</h3>
                            <p><strong>Описание:</strong> ${item.description}</p>
                            <p><strong>Автор:</strong> ${item.author}</p>
                            <p><strong>Год выпуска:</strong> ${item.year}</p>
                            <p><strong>Издательство:</strong> ${item.publisher}</p>
                            <p><strong>Количество выпусков:</strong> ${item.issues}</p>
                        `;
                    }
                    Modal.show({ title: 'Подробнее', content });
                };
            });
        }
        
        function attachFavoriteEvents() {
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const type = btn.dataset.type;
                    if (Storage.isFavorite(id)) {
                        Storage.removeFavorite(id);
                        btn.classList.remove('active');
                        Notify.success('Удалено из избранного');
                    } else {
                        Storage.addFavorite(id, type);
                        btn.classList.add('active');
                        Notify.success('Добавлено в избранное');
                    }
                    document.getElementById('favoritesCount').innerText = Storage.getFavorites().length;
                    if (currentView === 'favorites') renderFavorites();
                };
            });
        }
        
        function attachRatingEvents() {
            document.querySelectorAll('.rate-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const currentRating = Storage.getUserRating(id);
                    let starsHtml = '';
                    for (let i = 1; i <= 10; i++) {
                        starsHtml += `<i class="fas fa-star" data-val="${i}" style="font-size:32px;cursor:pointer;margin:5px;color:${currentRating && i <= currentRating ? '#ffc107' : '#ddd'}"></i>`;
                    }
                    Modal.show({
                        title: 'Оценить фильм',
                        content: `<div style="text-align:center"><p>Оцените фильм от 1 до 10</p><div style="display:flex; justify-content:center; flex-wrap:wrap;" id="rateStars">${starsHtml}</div></div>`
                    });
                    setTimeout(() => {
                        let selectedRating = currentRating || 0;
                        const stars = document.querySelectorAll('#rateStars i');
                        stars.forEach(star => {
                            star.onmouseenter = () => { let v = parseInt(star.dataset.val); stars.forEach((s, i) => s.style.color = i < v ? '#ffc107' : '#ddd'); };
                            star.onclick = () => { 
                                selectedRating = parseInt(star.dataset.val);
                                Storage.setUserRating(id, selectedRating);
                                Notify.success(`Оценка ${selectedRating}/10 сохранена`);
                                if (currentView === 'movies') renderMovies();
                                if (currentView === 'favorites') renderFavorites();
                                Modal.hide();
                            };
                        });
                    }, 100);
                };
            });
        }
        
        function navigateTo(page) {
            currentView = page;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) link.classList.add('active');
            });
            const titles = { home: 'MarvelPedia', characters: 'Персонажи Marvel', movies: 'Фильмы Marvel', comics: 'Комиксы Marvel', favorites: 'Избранное' };
            document.getElementById('pageTitle').innerText = titles[page] || 'MarvelPedia';
            if (page === 'home') renderHome();
            else if (page === 'characters') renderCharacters();
            else if (page === 'movies') renderMovies();
            else if (page === 'comics') renderComics();
            else if (page === 'favorites') renderFavorites();
        }
        
        // ==================== INIT ====================
        Storage.init();
        
        // Theme
        const savedTheme = Storage.getTheme();
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').onclick = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            Storage.saveTheme(newTheme);
        };
        
        // Navigation
        document.querySelectorAll('.nav-link').forEach(link => {
            link.onclick = () => navigateTo(link.dataset.page);
        });
        
        // Burger menu
        document.getElementById('burgerMenu').onclick = () => document.getElementById('sidebar').classList.add('open');
        document.getElementById('closeSidebar').onclick = () => document.getElementById('sidebar').classList.remove('open');
        
        // Admin panel
        document.getElementById('adminBtn').onclick = () => {
            Modal.show({
                title: 'Панель управления',
                content: `<div style="text-align:center">
                    <p><strong>Статистика:</strong></p>
                    <p>👥 Персонажей: ${Storage.getCharacters().length}</p>
                    <p>🎬 Фильмов: ${Storage.getMovies().length}</p>
                    <p>📚 Комиксов: ${Storage.getComics().length}</p>
                    <p>❤️ Избранное: ${Storage.getFavorites().length}</p>
                    <hr>
                    <p><strong>Инструкция по картинкам:</strong></p>
                    <p style="font-size:12px;">Создайте папку <strong>images</strong> и положите туда:</p>
                    <p style="font-size:11px;">📁 Персонажи: char1.jpg - char25.jpg</p>
                    <p style="font-size:11px;">📁 Фильмы: mov1.jpg - mov25.jpg</p>
                    <p style="font-size:11px;">📁 Комиксы: com_1.jpg - com_25.jpg</p>
                    <hr>
                    <button id="clearAllDataBtn" class="btn btn-secondary">🗑️ Очистить все данные</button>
                </div>`
            });
            setTimeout(() => {
                document.getElementById('clearAllDataBtn')?.addEventListener('click', () => {
                    if (confirm('ВНИМАНИЕ! Это удалит ВСЕ данные. Продолжить?')) {
                        localStorage.clear();
                        Storage.init();
                        Notify.success('Все данные очищены');
                        navigateTo('home');
                        Modal.hide();
                    }
                });
            }, 100);
        };
        
        // Update favorites count
        function updateFavCount() {
            document.getElementById('favoritesCount').innerText = Storage.getFavorites().length;
        }
        updateFavCount();
        
        // Start
        navigateTo('home');
    </script>
</body>
</html>
